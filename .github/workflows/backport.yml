name: Backport to develop

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.head_commit.message != 'Initial commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if develop is behind master
        id: check
        run: |
          BEHIND=$(git rev-list --count origin/develop..HEAD 2>/dev/null || echo "0")
          echo "count=$BEHIND" >> $GITHUB_OUTPUT

      - name: Create backport PR
        if: steps.check.outputs.count > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="backport/sync-master-$(date +'%Y%m%d')"
          git checkout -b "$BRANCH" origin/master
          git push origin "$BRANCH"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: sync master → develop" \
            --body "Backport de cambios de master a develop tras merge." \
            --label backport
