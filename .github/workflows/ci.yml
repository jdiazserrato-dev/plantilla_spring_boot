on:
  pull_request:
    branches: [develop, master]

jobs:
  branch-name-validation:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            if [[ ! "${{ github.head_ref }}" =~ ^feature/ ]]; then
              echo "❌ PRs to develop must come from a feature/* branch"
              exit 1
            fi
          elif [[ "${{ github.base_ref }}" == "master" ]]; then
            if [[ ! "${{ github.head_ref }}" =~ ^release/ ]]; then
              echo "❌ PRs to master must come from a release/* branch"
              exit 1
            fi
          fi
          echo "✅ Branch name validation passed"

  dependency-check:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven
      - name: Run OWASP Dependency Check
        run: mvn dependency-check:check -DskipTests

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven
      - name: Run Checkstyle
        run: mvn checkstyle:check
      - name: Run PMD
        run: mvn pmd:check pmd:cpd-check
      - name: Run SpotBugs
        run: mvn spotbugs:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven
      - name: Run tests with coverage
        run: mvn verify jacoco:report jacoco:check
