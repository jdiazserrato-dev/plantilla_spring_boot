spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: 20
    minimum-idle: 10
    connection-timeout: 5000

logging:
  level:
    com.jorel.template_api: WARN
    root: ERROR