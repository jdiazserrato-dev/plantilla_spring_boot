spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test_beta
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 5

logging:
  level:
    com.jorel.template_api: INFO
    root: WARN